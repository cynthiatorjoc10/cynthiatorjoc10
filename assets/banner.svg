<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14070f"/>
      <stop offset="1" stop-color="#1e0a18"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3d9"/>
      <stop offset="0.5" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#ff2d8a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff5fa8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ff5fa8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5fa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- window chrome -->
  <circle cx="40" cy="36" r="7" fill="#ff5fa8"/>
  <circle cx="64" cy="36" r="7" fill="#ffb3d9"/>
  <circle cx="88" cy="36" r="7" fill="#5a2a45"/>
  <text x="1160" y="41" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#ffb3d9" fill-opacity="0.55">~/cynthia — zsh</text>

  <!-- prompt line -->
  <text x="64" y="112" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" fill="#ffb3d9" fill-opacity="0.8">
    <tspan fill="#ff5fa8">❯</tspan> whoami
  </text>

  <!-- name -->
  <text x="60" y="200" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="url(#pink)">Cynthia Torjoc</text>

  <!-- subtitle + blinking cursor -->
  <text x="64" y="258" font-family="SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#f6dbe9">marketing girl · AI builder · pink in a dev's world</text>
  <rect x="724" y="240" width="12" height="24" fill="#ff5fa8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- sparkles -->
  <g fill="#ffb3d9">
    <path d="M1010 110 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill-opacity="0.9">
      <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1090 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M950 230 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill-opacity="0.5"/>
  </g>

  <!-- code-y heart -->
  <text x="1080" y="290" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" fill="#ff5fa8" fill-opacity="0.85">&lt;3</text>
</svg>
